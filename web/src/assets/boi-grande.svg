<style>
@keyframes piscar{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes sino{0%,40%,100%{transform:rotate(0)}8%{transform:rotate(14deg)}18%{transform:rotate(-10deg)}28%{transform:rotate(5deg)}}
@keyframes balanco{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.olho{transform-box:fill-box;transform-origin:50% 50%;animation:piscar 5s 1.5s infinite}
.olho+.olho{animation-delay:1.55s}
.sino{transform-box:fill-box;transform-origin:50% 0;animation:sino 4s 1s cubic-bezier(.45,0,.55,1) infinite}
.corpo{transform-box:view-box;transform-origin:50% 90%;animation:balanco 4s cubic-bezier(.45,0,.55,1) infinite}
@media (prefers-reduced-motion:reduce){.olho,.sino,.corpo{animation:none}}
</style>
