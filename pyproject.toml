[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anamnese-bovinos"
version = "0.1.0"
description = "Sistema especialista de anamnese de bovinos leiteiros (PoC, dados ficticios)"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.14,<2.15",
    "fastapi==0.156.8",
    "starlette==1.9.0",
    "uvicorn==0.54.0",
    "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.170,<6.171", "httpx==0.28.1"]

[tool.setuptools]
packages = ["kb", "engine", "api", "api.db", "api.rotas", "api.schemas", "api.servicos"]

[tool.setuptools.package-data]
"api.db" = ["esquema.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # a spec fixa httpx==0.28.1 e o TestClient do Starlette 1.9 já prefere o httpx2; só este aviso é ignorado
    'ignore:Using `httpx` with `starlette.testclient` is deprecated',
]
