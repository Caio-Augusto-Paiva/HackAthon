[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anamnese-bovinos"
version = "0.1.0"
description = "Sistema especialista de anamnese de bovinos leiteiros (PoC, dados ficticios)"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6"]

[tool.setuptools]
packages = ["kb", "engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
